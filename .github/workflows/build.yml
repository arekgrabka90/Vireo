name: Build APK

on:
  push:
    branches:
      - main
      - work/vireo-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Prepare stable signing key
        env:
          VIREO_KEYSTORE_BASE64: ${{ secrets.VIREO_KEYSTORE_BASE64 }}
        run: |
          test -n "$VIREO_KEYSTORE_BASE64"
          printf '%s' "$VIREO_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/vireo-release.p12"
          test -s "$RUNNER_TEMP/vireo-release.p12"

      - name: Build signed APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VIREO_KEYSTORE_PATH: ${{ runner.temp }}/vireo-release.p12
          VIREO_KEYSTORE_PASSWORD: ${{ secrets.VIREO_KEYSTORE_PASSWORD }}
          VIREO_KEY_ALIAS: ${{ secrets.VIREO_KEY_ALIAS }}
          VIREO_KEY_PASSWORD: ${{ secrets.VIREO_KEY_PASSWORD }}
        run: |
          test -n "$TMDB_API_KEY"
          test -n "$VIREO_KEYSTORE_PASSWORD"
          test -n "$VIREO_KEY_ALIAS"
          test -n "$VIREO_KEY_PASSWORD"
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vireo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Room schema artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vireo-room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30

  android-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vireo-android-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
